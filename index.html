<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Autos</title>
    <!-- Vinculamos el archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Mi Colección de Autos</h1>
        <p>Dos grandes máquinas deportivas</p>
    </header>

    <main class="cars-container">
        <!-- Tarjeta del Auto 1 -->
        <div class="car-card">
            <img class="car-image" src="imagenes/auto1.jpg" alt="BMW deportivo">
            <div class="car-info">
                <h2>BMW Deportivo</h2>
                <p>Vehículo deportivo de alto rendimiento con diseño aerodinámico y motor potente.</p>
            </div>
        </div>

        <!-- Tarjeta del Auto 2 -->
        <div class="car-card">
            <img class="car-image" src="imagenes/auto2.jpg" alt="Toyota moderno">
            <div class="car-info">
                <h2>Toyota Moderno</h2>
                <p>Modelo moderno con excelente tecnología, eficiencia de combustible y gran elegancia.</p>
            </div>
        </div>
    </main>

    <!-- Sección del diseño de Canva -->
    <section style="margin-top: 50px; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center;">
        <h2 style="margin-bottom: 20px; color: #ffffff;">Presentación interactiva</h2>
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); border-radius: 8px; overflow: hidden;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"
                src="https://canva.link/v2c9tytnc9aty4i" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
    </section>

</body>
</html>
